window.addEventListener('pageshow', event => {
  if(event.persisted){ syncSbar(true); pumpThumbs(); }
});


/* ---------------- 启动 ---------------- */
(async () => {
  syncLibs();
  const seg0 = $('#seg');
  if(seg0) seg0.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.mode === S.mode));
  syncChips();                               /* req-topsel：类型下拉同步 */
  if(sortSel) sortSel.set(S.sort || 'mtime', true);
  renderTree();
  // 返回时不要让浏览器自己也去恢复滚动（会和我们的 restorePos 打架，出现跳动）
  try{ if('scrollRestoration' in history) history.scrollRestoration = 'manual'; }catch(e){}
  paintCrumb();                                // 进页面第一帧就有目录名，不留空白
  // 侧栏目录树：先用 sessionStorage 缓存画出来（返回时立刻有），再后台刷新。
  // 关键：**不要** await tree 再 load()——树慢的时候（实测 1.7s）整屏卡片都要等它。
  // 命中缓存时也放到下一个事件循环再画：361 行 DOM 在手机上要几十毫秒，
  // 先让"内容"这条线把卡片铺上去，侧栏随后补上（返回体感更快）。
  if(loadTreeCache()) setTimeout(renderTree, 0);
  if(loadSnap()){
    repaint();                                 // ★ 零请求：直接铺出返回前的列表
    if(S.lib === 'dir' && S.parentId === null) renderCrumbs();
  }else{
    await load();                              // 正常进入才有这一次请求
  }
  await restorePos();
  syncSbar(true);
  (async () => {
    // 缓存够新（60 秒内）就不后台刷了：目录树是 13KB 的 JSON，
    // 手机流量和解析都省下来（返回列表时我们本来就只关心内容）
    try{
      const _c = JSON.parse(sessionStorage.getItem('b2tree') || 'null');
      if(_c && Date.now() - (_c.at || 0) < 60000 && _c.data){ return; }
    }catch(e){}
    try{
      const j = await api('/api/tree?depth=2');
      treeData = j; saveTree();
      if(S.lib === 'dir' && S.dir) openSet.add((j.nodes || []).length ? (j.nodes[0] || {}).id || '' : '');
      renderTree();
    }catch(e){ if(!treeData) renderTree(); }
  })();
})();

/* ============ scrollbar-v3（sb-host-fix）细胶囊滚动条 · 不滚动自动隐藏 ============
   host     = 不滚动的父容器（.side / .main），滑块挂这里，不会被内容滚走
   scroller = 真正滚动的元素（.tree / #body），只用来读 scrollTop / scrollHeight
*/
/* req2567-scrollbar：.sb-fake 注入逻辑已移除（与 #sbar 重复） */

/* ============ 图片边缘光漫射（G3）：把视口内卡片的缩略图复制到发光层 ============ */
(function(){
  const layer = () => document.getElementById('glowlayer');
  /* 分级判定（lowfx-tier）：
     · iOS 的 Safari 出于省电 hardwareConcurrency 常报 4，不能据此判定"不可用" → 只降级不关闭
     · nofx（彻底关）：内存 <2GB、开启省流量、或系统要求减少动效
     · lowfx（降级）  ：≤4 核 / 移动端 / 小屏 —— 保留磨砂，只减光斑 */
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
  const cores = navigator.hardwareConcurrency || 4;
  const memGB = navigator.deviceMemory || 0;                 /* Chrome 有，Safari 无 → 0 */
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const saveData = !!(navigator.connection && navigator.connection.saveData);
  const tinyScreen = Math.min(innerWidth, innerHeight) <= 360;

  const nofx = (memGB > 0 && memGB < 2) || saveData || reduceMotion;
  const lowfx = !nofx && (cores <= 4 || isMobile || tinyScreen);

  if (nofx) document.body.classList.add('nofx');
  else if (lowfx) document.body.classList.add('lowfx');
/* ★ req-glow4/5：卡片发光总控
     · 每张卡**一个** .glowcard div，坐标写在**滚动内容坐标系**（跟着内容滚，滚动不重算）
     · 几何用**卡片 rect**（不是 img rect —— img 高度是 calc(100% + 51px)，比卡片高会向下溢出）
     · 缩略图没到就先给一层中性光（PLACEHOLDER），解码后换成该图**边缘像素平均色**
     · 距离 = 网格间距（.grid{gap:13px}），三层 box-shadow 由强到弱 → 填满缝隙并与邻卡叠加
     · 滚动只做"新进视口的卡片补光"（幂等、不重建）；hover 时与卡片同步上移 */
  let raf = 0;
  const GAP_FALLBACK = 13;
  const GLOW_SOFT = lowfx ? 220 : 900;    /* req-glowfix：软上限（远超一屏，不再让新卡没光） */
  const GLOW_PRUNE_AT = lowfx ? 120 : 400; /* 超过这个数才裁剪"离视口很远"的光斑 */
  const PLACEHOLDER = '196,206,222';        /* 中性光色（缩略图未到） */
  const EDGE_CACHE = new Map();             /* img.src → "r,g,b" */
  const GLOW_MAP = new Map();               /* card 元素 → 光斑 div */

  function gridGap(){
    const g = document.querySelector('.grid');
    if(!g) return GAP_FALLBACK;
    const cs = getComputedStyle(g);
    const v = Math.min(parseFloat(cs.columnGap) || GAP_FALLBACK, parseFloat(cs.rowGap) || GAP_FALLBACK);
    return Math.max(6, Math.round(v || GAP_FALLBACK));
  }
  function edgeColor(img){
    const key = img.src, hit = EDGE_CACHE.get(key);
    if(hit !== undefined) return hit;
    let out = null;
    try{
      const n = 5, cv = document.createElement('canvas');
      cv.width = n; cv.height = n;
      const cx = cv.getContext('2d', {willReadFrequently:true});
      cx.drawImage(img, 0, 0, n, n);
      const d = cx.getImageData(0, 0, n, n).data;
      let r = 0, g = 0, b = 0, cnt = 0;
      for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){
        if(x && y && x < n - 1 && y < n - 1) continue;      /* 只统计最外一圈 */
        const p = (y * n + x) * 4;
        if(d[p + 3] < 8) continue;
        r += d[p]; g += d[p + 1]; b += d[p + 2]; cnt++;
      }
      if(cnt){
        r /= cnt; g /= cnt; b /= cnt;
        /* req-glow5c：很多图边缘本身就是黑色 —— 直接用会跟深色背景融成一片（看着像没光）。
           这里在 HSL 里把亮度抬进"能发光"的区间（暗色抬、亮色不动），并适度加饱和。 */
        let mx = Math.max(r, g, b) / 255, mn = Math.min(r, g, b) / 255;
        let hh = 0, ss = 0, ll = (mx + mn) / 2;
        const dd = mx - mn;
        if(dd > 0.0001){
          ss = ll > 0.5 ? dd / (2 - mx - mn) : dd / (mx + mn);
          if(mx === r / 255) hh = ((g - b) / 255) / dd + (g < b ? 6 : 0);
          else if(mx === g / 255) hh = ((b - r) / 255) / dd + 2;
          else hh = ((r - g) / 255) / dd + 4;
          hh /= 6;
        }
        if(ll < 0.46) ll = 0.46 + ll * 0.30;          /* 暗色抬亮；≥0.46 保持原样 */
        ss = Math.min(1, ss * 1.22 + 0.05);
        /* HSL → RGB */
        const q = ll < 0.5 ? ll * (1 + ss) : ll + ss - ll * ss, p2 = 2 * ll - q;
        const f = t2 => { t2 = (t2 + 1) % 1;
          if(t2 < 1/6) return p2 + (q - p2) * 6 * t2;
          if(t2 < 1/2) return q;
          if(t2 < 2/3) return p2 + (q - p2) * (2/3 - t2) * 6;
          return p2; };
        out = [f(hh + 1/3), f(hh), f(hh - 1/3)]
          .map(v => Math.round(Math.max(0, Math.min(1, v)) * 255)).join(',');
      }
    }catch(e){ /* 取不到色就用中性光 */ }
    if(EDGE_CACHE.size > 500) EDGE_CACHE.clear();
    EDGE_CACHE.set(key, out);
    return out;
  }
  function ensureLayer(){
    const bodyEl = document.getElementById('body');
    if(!bodyEl) return null;
    let w = document.getElementById('glowlayer');
    if(!w){ w = document.createElement('div'); w.className = 'glowlayer'; w.id = 'glowlayer';
      w.setAttribute('aria-hidden', 'true'); }
    if(w.parentNode !== bodyEl) bodyEl.insertBefore(w, bodyEl.firstChild);
    return w;
  }
  function inView(card){
    const r = card.getBoundingClientRect(), vh = innerHeight;
    return r.bottom > -320 && r.top < vh + 320;
  }
  function makeGlow(card){
    if(GLOW_MAP.has(card) || GLOW_MAP.size >= GLOW_SOFT || !card.isConnected) return null;
    if(document.body.classList.contains('nofx')) return null;
    const wrap = ensureLayer(); if(!wrap) return null;
    const bodyEl = document.getElementById('body');
    const bb = bodyEl.getBoundingClientRect(), r = card.getBoundingClientRect();
    if(r.width < 2 || r.height < 2) return null;
    const br = parseFloat(getComputedStyle(card).borderRadius) || 11;
    const d = document.createElement('div');
    d.className = 'glowcard';
    d.style.cssText = 'left:' + Math.round(r.left - bb.left + bodyEl.scrollLeft) +
      'px;top:' + Math.round(r.top - bb.top + bodyEl.scrollTop) +
      'px;width:' + Math.round(r.width) + 'px;height:' + Math.round(r.height) +
      'px;border-radius:' + br + 'px';
    d.style.setProperty('--gw', gridGap() + 'px');
    d.style.setProperty('--glow-c', PLACEHOLDER);
    d.dataset.ph = '1';
    wrap.appendChild(d);
    GLOW_MAP.set(card, d);
    return d;
  }
  function armCard(card){
    const img = card.querySelector('img');
    if(!GLOW_MAP.has(card)){
      if(!inView(card)) return;
      makeGlow(card);
    }
    if(!img || img.dataset.glowDone) return;
    img.dataset.glowDone = '1';
    const paint = () => {
      if(!img.naturalWidth) return;
      const col = edgeColor(img); if(!col) return;
      let d = GLOW_MAP.get(card);
      if(!d) d = makeGlow(card);
      if(d){ d.style.setProperty('--glow-c', col); delete d.dataset.ph; }
    };
    if(img.complete && img.naturalWidth) paint();
    else img.addEventListener('load', paint, {once:true});
  }
  let lastW = innerWidth;
  function syncGlow(){
    GLOW_MAP.forEach((d, card) => { if(!card.isConnected){ d.remove(); GLOW_MAP.delete(card); } });
    if(innerWidth !== lastW){
      lastW = innerWidth;
      GLOW_MAP.forEach(d => d.remove()); GLOW_MAP.clear();
    }
    /* req-glowfix：光斑多了才裁剪"离视口很远"的（远端的 box-shadow 不划算），
       近处/可见的永远保留 —— 这样往回滚时不会再出现"顶部没光要刷新" */
    if(GLOW_MAP.size > GLOW_PRUNE_AT){
      const lim = innerHeight * 4;
      GLOW_MAP.forEach((d, card) => {
        const r = card.getBoundingClientRect();
        if(r.bottom < -lim || r.top > innerHeight + lim){ d.remove(); GLOW_MAP.delete(card); }
      });
    }
    document.querySelectorAll('.grid > .card, .grid > .fcard').forEach(armCard);
    forceLiftSync();          /* req-glow6：重绘/补光后全量对齐，避免任何残留 */
  }
  function schedule(){ if(raf) return; raf = requestAnimationFrame(()=>{ raf=0; syncGlow(); }); }
  let st = 0;
  function onScroll(){ if(st) return; st = setTimeout(()=>{ st = 0; syncGlow(); }, 120); }
  /* ★ req-glow6：上移同步**不靠事件配对、也不靠状态类**，而是直接复制卡片的
     真实 computed transform 到光斑上。这样任何"状态残留"都会被下一次同步自动纠正：
       · 从播放页/灯箱返回（DOM 从缓存恢复，不触发任何 pointer 事件）
       · 触屏点按后的粘滞 :hover
       · 卡片 :hover/:active 之外将来新增的位移
     并在 pageshow / visibilitychange / focus / popstate 时做一次**全量纠正**。 */
  let lraf = 0, lastHot = null;
  function hotCard(){
    return document.querySelector('.grid > .card:hover, .grid > .card:active, ' +
                                  '.grid > .fcard:hover, .grid > .fcard:active');
  }
  function cardShiftY(card){
    const t = getComputedStyle(card).transform;
    if(!t || t === 'none') return 0;
    const m = t.match(/matrix\(([^)]+)\)/);
    if(m){ const q = m[1].split(',').map(Number); return q[5] || 0; }
    return 0;
  }
  function applyLift(d, card){
    const ty = cardShiftY(card);
    d.style.transform = ty ? 'translateY(' + ty + 'px)' : '';
  }
  function syncLift(){
    if(lraf) return;
    lraf = requestAnimationFrame(() => {
      lraf = 0;
      const hot = hotCard();
      if(lastHot && lastHot !== hot){            /* 上一张已不高亮 → 读它真实位移归位 */
        const d = GLOW_MAP.get(lastHot);
        if(d) applyLift(d, lastHot);
      }
      if(hot){
        const d = GLOW_MAP.get(hot);
        if(d) applyLift(d, hot);
      }
      lastHot = hot;
    });
  }
  /* 全量纠正：页面恢复（返回/切回标签/窗口重新聚焦）时用，把每张光斑拉回与卡片一致 */
  function forceLiftSync(){
    lastHot = null;
    GLOW_MAP.forEach((d, card) => applyLift(d, card));
    syncLift();
  }
  window.addEventListener('resize', schedule);
  window.addEventListener('load', schedule);
  const bodyEl0 = document.getElementById('body');
  if (bodyEl0){
    bodyEl0.addEventListener('scroll', onScroll, {passive:true});      /* 幂等：只补新进视口的卡 */
    ['pointerover', 'pointerout', 'pointerdown', 'pointerup', 'pointercancel',
     'touchstart', 'touchend', 'pointermove'].forEach(ev =>
      bodyEl0.addEventListener(ev, syncLift, {passive:true}));
    /* ★ req-glow6：从播放页/灯箱返回、切回标签、窗口聚焦时全量纠正一次
       （这些场景不触发 pointer 事件，否则光斑会停在"上移"位置） */
    window.addEventListener('pageshow', forceLiftSync);
    window.addEventListener('focus', forceLiftSync);
    window.addEventListener('popstate', forceLiftSync);
    document.addEventListener('visibilitychange', () => { if(!document.hidden) forceLiftSync(); });
    new MutationObserver(muts => {
      for(const m of muts){
        if(m.target && m.target.closest && m.target.closest('#glowlayer')) continue;
        /* req-glowfix：repaint 会清空 #body（光斑层一起没了）—— 直接同步补回，
           不走 requestAnimationFrame，避免"重绘后有一帧没光" */
        syncGlow(); return;
      }
    }).observe(bodyEl0, {childList:true, subtree:true});
  }
  schedule();
})();

/* ===== req2567-modal：磨砂确认弹窗控制 =====
   弹窗 HTML 位于脚本块之后，脚本执行时元素还不存在，
   因此必须等 DOM 就绪再绑事件（否则按钮完全没反应，弹窗卡死）。 */
let __gotoCb = null;
function askGoto(dirName, onOk){
  const mask = document.getElementById('gotoMask');
  const dirEl = document.getElementById('gotoDir');
  if(!mask || !dirEl){
    /* 降级：元素缺失时退回原生确认 */
    if(confirm('跳到目录「' + dirName + '」？')) onOk();
    return;
  }
  if(mask.dataset.bound !== '1') bindGotoModal();   /* 现场补绑，防漏 */
  dirEl.textContent = dirName;
  __gotoCb = onOk;
  mask.classList.add('on');
  mask.setAttribute('aria-hidden', 'false');
  setTimeout(function(){ const c = document.getElementById('gotoCancel'); if(c) c.focus(); }, 60);
}
function closeGoto(ok){
  const mask = document.getElementById('gotoMask');
  if(!mask) return;
  mask.classList.remove('on');
  mask.setAttribute('aria-hidden', 'true');
  const cb = __gotoCb; __gotoCb = null;
  if(ok && cb) cb();
}
function bindGotoModal(){
  const mask = document.getElementById('gotoMask');
  if(!mask || mask.dataset.bound === '1') return;
  mask.dataset.bound = '1';
  const okBtn = document.getElementById('gotoOk');
  const cancelBtn = document.getElementById('gotoCancel');
  if(okBtn) okBtn.addEventListener('click', function(){ closeGoto(true); });
  if(cancelBtn) cancelBtn.addEventListener('click', function(){ closeGoto(false); });
  mask.addEventListener('click', function(e){ if(e.target === mask) closeGoto(false); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && mask.classList.contains('on')){
      e.stopPropagation(); closeGoto(false);
    }
  }, true);
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', bindGotoModal);
}else{
  bindGotoModal();
}
window.addEventListener('load', bindGotoModal);
</script>

<div id="gotoMask" aria-hidden="true">
  <div id="gotoModal" role="dialog" aria-modal="true" aria-labelledby="gotoDir">
    <p class="ttl">跳到这个目录？</p>
    <p class="dir" id="gotoDir"></p>
    <p class="sub">将离开当前列表，打开该目录的浏览页</p>
    <div class="row">
      <button id="gotoCancel">取消</button>
      <button class="pri" id="gotoOk">跳到目录</button>
    </div>
  </div>
</div>
